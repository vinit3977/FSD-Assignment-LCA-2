
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive To-Do List | Assignment 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <a href="../index.html" class="back-nav-btn">
        <span class="back-arrow">←</span>
        <span>Back to Portfolio</span>
    </a>

    <div class="container">
        <div class="badge-pill">
            <span class="badge-dot"></span>
            <span>ASSIGNMENT 02</span>
        </div>

        <h2>Interactive To-Do List</h2>
        <p class="subtitle">Organize and track your daily tasks dynamically</p>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="What needs to be done?">
            <button id="addBtn">
                <span>+</span> Add Task
            </button>
        </div>

        <div class="list-header">
            <span class="list-title">Active Tasks</span>
            <span class="list-hint">Click task to toggle complete</span>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
