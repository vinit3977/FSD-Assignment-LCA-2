
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form | Assignment 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <a href="../index.html" class="back-nav-btn">
        <span class="back-arrow">←</span>
        <span>Back to Portfolio</span>
    </a>

    <div class="container">
        <form id="registrationForm">
            <div class="badge-pill">
                <span class="badge-dot"></span>
                <span>ASSIGNMENT 03</span>
            </div>

            <h2>User Registration</h2>
            <p class="subtitle">Client-side validation with dynamic error states</p>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="John Doe">
                <small id="nameError" class="error"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="text" id="email" placeholder="john@example.com">
                <small id="emailError" class="error"></small>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" placeholder="10-digit mobile number">
                <small id="phoneError" class="error"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 8 chars (A-Z, a-z, 0-9, symbol)">
                <small id="passwordError" class="error"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Repeat your password">
                <small id="confirmPasswordError" class="error"></small>
            </div>

            <button type="submit">Create Account</button>

            <p id="successMessage" class="success"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
